
name: Build Album Art Studio Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller mutagen pillow

      - name: Build Windows EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name Album-Art-Studio main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Album-Art-Studio-Windows-EXE
          path: dist/Album-Art-Studio.exe
          if-no-files-found: error
          retention-days: 14
